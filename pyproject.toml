[project]
name = "musictl"
version = "0.2.0"
description = "Music control utility for MPD + beets"
authors = [
    {name = "Sanek", email = "anton@shuvalov.info"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "cyclopts>=3",
    "python-mpd2>=3",
    "beets>=2",
    "ffcuesplitter>=1",
]

[project.scripts]
musictl = "musictl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "basedpyright>=1.38.2",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
